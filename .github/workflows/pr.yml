name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # Unit tests live in the Rust lib (codec/protocol/mod). They link
      # libpython, so pyo3's extension-module feature must stay off; the
      # interpreter's lib dir must be on the loader path for the test binary.
      - name: Rust unit tests
        shell: bash
        run: |
          export PYO3_PYTHON="$(which python3)"
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # dyld ignores LD_LIBRARY_PATH; give macOS the same search path.
          export DYLD_FALLBACK_LIBRARY_PATH="$LD_LIBRARY_PATH"
          cargo test --lib --no-default-features

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/Cargo.toml

      - name: Set up Python with uv
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies with uv
        # pytest-asyncio backs the `asyncio_mode = auto` in pytest.ini; without it
        # the async tests fail outright. It currently arrives as a side effect of
        # `maturin develop` syncing uv.lock — named here so the suite does not
        # depend on that. uvloop is the loop this client targets, and this matrix
        # is Linux-only, so it is always installable.
        run: uv pip install maturin pytest pytest-asyncio websockets uvloop

      - name: Build
        run: maturin develop --release

      - name: Run tests
        run: pytest tests/

  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up build environment
        run: |
          uv python install 3.12
          uv venv --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install maturin

      - name: Build wheel
        run: maturin build --release

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu
          path: target/wheels/*.whl